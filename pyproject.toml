[tool.poetry]
name = "target-activecampaign"
version = "0.0.1"
description = "`target-activecampaign` is a Singer target for ActiveCampaign, built with the Meltano Singer SDK."
readme = "README.md"
authors = ["Hotglue <hello@hotglue.io>"]
keywords = [
    "ELT",
    "ActiveCampaign",
]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "<3.12,>=3.7.1"
hotglue-singer-sdk = "^1.0.3"
requests = "^2.31.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"

[tool.poetry.extras]
s3 = ["fs-s3fs"]

[tool.ruff]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
]
select = ["ALL"]
src = ["target_activecampaign"]
target-version = "py37"

[tool.ruff.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.isort]
known-first-party = ["target_activecampaign"]

[tool.ruff.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
target-activecampaign = 'target_activecampaign.target:TargetActiveCampaign.cli'
